name: JuliaNightly
# Unreleased Julia, on a schedule.
#
# Separate from `testing.yaml` because a failure here is **information rather than a broken build**:
# it says that an unreleased Julia has changed under us, which is worth knowing early and is not a
# reason to block a merge. Weekly, since nightly is far out and noisy, so a failure is a heads-up
# rather than a deadline. The released versions, the latest included, are `testing.yaml`'s matrix.

on:
  schedule:
    - cron: '0 2 * * 0'      # Sunday at 2 AM UTC
  workflow_dispatch:

jobs:
  nightly:
    name: Julia nightly - Ubuntu - x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up julia
        uses: julia-actions/setup-julia@v3
        with:
          version: nightly
          arch: x64
      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true
      - name: Run tests
        uses: julia-actions/julia-runtest@v1
