name: Metadata and hygiene

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
  actions: write
  contents: read

jobs:
  metadata:
    name: RSMD - ${{ github.event_name }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - name: Cache
        uses: julia-actions/cache@v3
      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
      - name: Running hygiene tests
        # Just the hygiene checks, named as a test argument. Going through `Pkg.test` is what
        # provisions the `test` target's dependencies (Git, JuliaFormatter, ResearchSoftwareMetadata),
        # which no other invocation supplies.
        run: julia --project=. -e 'using Pkg; Pkg.test(; test_args = ["extras_clean.jl"])'
