name: CI

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:

permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
  actions: write
  contents: read

jobs:
  # Fetch the rasters the suite reads, in a job that does nothing else, so the job that runs the
  # tests can restore them instead of downloading them.
  #
  # 🔴 THIS IS ABOUT MEMORY AS MUCH AS TIME. Downloading while the suite is at its peak is what made
  # the Linux runner unsurvivable: `test_datasetread.jl` alone reached 7.0 GB resident of the
  # runner's 16 GB, and ~1 GB of concurrent downloads filling the page cache on top of that took the
  # machine far enough into swap that the Actions agent was sent a shutdown signal. ⚠️ **Nothing after
  # that point runs** — not `if: always()`, not a post step — so the tests never reached their own
  # cache-saving step and the next run downloaded again. The loop could not break itself, which is
  # why breaking it needs a job that is not the test job.
  #
  # ⭐ `test/primecache.jl` calls `getraster`, which downloads without reading pixels, so this job
  # stays in a few hundred MB whatever it fetches — it survives precisely what the test job could not.
  prime-raster-cache:
    name: Prime the raster cache - ${{ matrix.os }}
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write
      contents: read
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
      fail-fast: false
    steps:
    # ⭐ `lookup-only` asks whether the key exists WITHOUT downloading the ~1 GB behind it, and every
    # step below is skipped when it does. So once a cache exists this whole job is a checkout-free
    # metadata query taking seconds, and only a cold cache pays for Julia, the build and the fetch.
    - name: Is the raster cache already there?
      id: probe
      uses: actions/cache/restore@v6
      with:
        path: ~/.julia/scratchspaces
        key: rasterdata-${{ runner.os }}-v1
        lookup-only: true
    - name: Checkout code
      if: steps.probe.outputs.cache-hit != 'true'
      uses: actions/checkout@v7
    - name: Set up julia
      if: steps.probe.outputs.cache-hit != 'true'
      uses: julia-actions/setup-julia@v3
      with:
        version: '1'
    - name: Cache
      if: steps.probe.outputs.cache-hit != 'true'
      uses: julia-actions/cache@v3
    - name: Build package
      if: steps.probe.outputs.cache-hit != 'true'
      uses: julia-actions/julia-buildpkg@v1
    - name: Download the rasters
      # Goes through `Pkg.test` for the same reason every other invocation does: `RasterDataSources`
      # is a weak dependency and only the test environment provides it.
      if: steps.probe.outputs.cache-hit != 'true'
      shell: bash
      run: julia --project -e 'using Pkg; Pkg.test(test_args = ["primecache.jl"])'
    - name: Discard the extracted archives before the cache is saved
      # The same 182 MB saving as in the test job below, and the same reasoning — see there.
      if: always() && steps.probe.outputs.cache-hit != 'true'
      shell: bash
      run: rm -rf ~/.julia/scratchspaces/*/assets/RasterDataSources/*/*/zips
    - name: Save the raster data cache
      # ⚠️ `if: always()` so a partly-primed cache is still saved. `primecache.jl` reports a failed
      # entry rather than throwing, exactly so that one unreachable host does not discard the rest:
      # a gap costs the test job a few downloads, never a wrong answer.
      if: always() && steps.probe.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.julia/scratchspaces
        key: rasterdata-${{ runner.os }}-v1

  EcoSISTEM-tests:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    needs: prime-raster-cache
    # ⭐ Priming is an OPTIMISATION, NEVER A GATE. A plain `needs:` would skip the whole test matrix
    # when a prime job failed, which would turn a slow download into no tests at all; `!cancelled()`
    # keeps the dependency's *ordering* — the tests start once priming is done — while dropping its
    # veto. The tests still fetch anything the cache lacks, exactly as before this job existed.
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      matrix:
        julia-version:
          - '1.11'
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        R-version:
          - 'release'
        arch:
          - x64
          - arm64
        experimental:
          - false
        exclude:
          - os: macOS-latest
            arch: x64
          - os: ubuntu-latest
            arch: arm64
          - os: windows-latest
            arch: arm64
      fail-fast: false
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up julia
      uses: julia-actions/setup-julia@v3
      with:
        version: ${{ matrix.julia-version }}
        arch: ${{ matrix.arch }}
    - name: Cache
      uses: julia-actions/cache@v3
    - name: Restore the raster data cache
      id: rasters
      # julia-actions/cache caches the package depot but not scratchspaces, where the raster
      # downloads (~850 MB) and aggregated layers (~700 MB) live. Cache them here — tar preserves
      # mtime, so the aggregate cache, which is keyed partly on source mtime, still hits.
      #
      # 🔴 RESTORE AND SAVE ARE SEPARATE STEPS BECAUSE THE SAVE MUST HAPPEN ON A FAILING JOB.
      # `actions/cache` writes its cache in an implicit post-job step that only runs when the job
      # succeeded, so a suite that fails for any reason — including running out of time *because*
      # nothing was cached — can never populate the cache it needed. That is not hypothetical: it is
      # why every run so far has reported `Cache not found`, re-downloaded ~850 MB, and spent about
      # a quarter of the macOS job doing it. The explicit save step below carries `if: always()`.
      #
      # ⭐ THE KEY IS DELIBERATELY STATIC, and versioned by hand. Content-hashing the files that
      # trigger downloads was the previous approach and had two faults: it named
      # `test/test_ReadData.jl` and `test/test_AbioticEnv.jl`, both of which were renamed out of
      # existence (`hashFiles` contributes nothing for a path that does not exist, so the key silently
      # stopped tracking anything), and nineteen test files can now trigger a download, so any edit to
      # any of them would mint a fresh ~1.3 GB cache entry per matrix job and evict the far more
      # valuable depot caches under the repository's 10 GB ceiling.
      #
      # ⚠️ A restored cache can never be wrong, only incomplete: `getraster`/`download` each test the
      # target file's own existence before fetching, so a partial restore costs a few per-file
      # downloads rather than giving incorrect data. That is what makes a static key safe — and it is
      # also the repair route if a save ever lands incomplete. BUMP THE `-v1` SUFFIX to mint a new
      # entry; there is no need to work out which file changed.
      uses: actions/cache/restore@v6
      with:
        path: ~/.julia/scratchspaces
        key: rasterdata-${{ runner.os }}-v1
        restore-keys: |
          rasterdata-${{ runner.os }}-
    - name: Build package
      uses: julia-actions/julia-buildpkg@v1
    - name: Start a resource sampler
      # 🔴 THE LINUX RUNNER IS SHUT DOWN MID-SUITE AND THE LOG DOES NOT SAY WHY. It reports only
      # `signal 15` and *"the runner has received a shutdown signal"*, roughly two minutes into the
      # tests, and NOTHING after that point runs — so there is no post step, no `if: always()`, and no
      # summary that could record the machine's state at the moment it died. This writes that state
      # to a file continuously instead, so the last line before the kill names the resource that ran
      # out.
      #
      # ⚠️ Worth knowing what it has already ruled out, so the answer is not re-guessed: the rasters
      # are restored from cache rather than downloaded, and the peak resident of the worst single
      # process across the whole set measures 6.1 GB against the runner's 16 GB. Memory alone does not
      # explain it, which is why DISK is sampled here too — `ubuntu-latest` has only 14 GB of it, and
      # EcoSISTEM writes aggregated layers as it reads.
      #
      # Linux and macOS only: `free` is a GNU tool, and the Windows jobs have never shown this.
      if: runner.os != 'Windows'
      shell: bash
      run: |
        (while true; do
           echo "=== $(date -u +%H:%M:%S)"
           df -h / 2>/dev/null | tail -1
           if command -v free > /dev/null; then free -m | sed -n '2p'; else vm_stat | head -4; fi
           sleep 5
         done > "${RUNNER_TEMP}/resources.log" 2>&1) &
        echo "SAMPLER_PID=$!" >> "$GITHUB_ENV"
    - name: Running
      # ⭐ Coverage instrumentation is a large slowdown and only one job's output is ever used, so it
      # runs on exactly one matrix entry — macOS, which is the fastest runner here, on the release
      # Julia. Every other entry runs the same tests uninstrumented.
      uses: julia-actions/julia-runtest@v1
      with:
        coverage: ${{ matrix.os == 'macOS-latest' && matrix.julia-version == '1' }}
    - name: Report the last resource readings
      # ⭐ The point of the whole exercise: the tail of this file is the machine's state in the
      # seconds before it died. `if: always()` is enough here because a step CAN still run after the
      # test step fails — what it cannot survive is the runner itself being shut down, and in that
      # case the file is simply lost, which is itself worth knowing.
      if: always() && runner.os != 'Windows'
      shell: bash
      run: |
        kill "${SAMPLER_PID}" 2> /dev/null || true
        echo "--- last 40 readings before the end of the test step ---"
        tail -40 "${RUNNER_TEMP}/resources.log" || echo "(no sampler output)"
    - name: Discard the extracted archives before the cache is saved
      # ⭐ Worth 182 MB of the ~1 GB raster cache, at no cost. These are the *downloaded archives*,
      # and RasterDataSources extracts each one and thereafter tests `!isfile(raster_path)` on the
      # **extracted** tif before fetching anything (`WorldClim/climate.jl:21`) — so the archive is
      # only ever consulted when its tif is missing, and caching the tifs without it triggers no
      # re-download.
      #
      # ⚠️ Done as a step rather than as a `!`-exclusion in the cache `path`, because
      # `actions/cache` saves in a post-job step: deleting here is unambiguous, whereas whether a
      # leading `~` expands inside an exclusion pattern is not.
      if: always()
      shell: bash
      run: rm -rf ~/.julia/scratchspaces/*/assets/RasterDataSources/*/*/zips
    - name: Save the raster data cache
      # ⭐ `if: always()` is the whole point of splitting restore from save — see the restore step.
      # Skipped on an exact hit, since `actions/cache/save` cannot overwrite a key that already
      # exists and would only log a warning. `cache-hit` is `true` only for an *exact* match, so a
      # run that fell back to the `restore-keys` prefix does still save, which is how a cache minted
      # under an older key version gets promoted to the current one.
      #
      # ⚠️ Ordered after the archive discard above, so the 182 MB of zips are gone before the save
      # reads the directory. With the implicit post-job save this ordering was invisible and only
      # worked by accident of post steps running last.
      if: always() && steps.rasters.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.julia/scratchspaces
        key: rasterdata-${{ runner.os }}-v1
    - name: Process coverage
      if: matrix.os == 'macOS-latest' && matrix.julia-version == '1'
      uses: julia-actions/julia-processcoverage@v1
    - name: Codecov
      if: matrix.os == 'macOS-latest' && matrix.julia-version == '1'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
