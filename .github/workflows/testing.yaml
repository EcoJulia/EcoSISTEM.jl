name: CI

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:

permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
  actions: write
  contents: read

jobs:
  EcoSISTEM-tests:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      matrix:
        julia-version:
          - '1.11'
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        R-version:
          - 'release'
        arch:
          - x64
          - arm64
        experimental:
          - false
        exclude:
          - os: macOS-latest
            arch: x64
          - os: ubuntu-latest
            arch: arm64
          - os: windows-latest
            arch: arm64
      fail-fast: false
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up julia
      uses: julia-actions/setup-julia@v3
      with:
        version: ${{ matrix.julia-version }}
        arch: ${{ matrix.arch }}
    - name: Cache
      uses: julia-actions/cache@v3
    - name: Restore the raster data cache
      id: rasters
      # julia-actions/cache caches the package depot but not scratchspaces, where the raster
      # downloads (~850 MB) and aggregated layers (~700 MB) live. Cache them here — tar preserves
      # mtime, so the aggregate cache, which is keyed partly on source mtime, still hits.
      #
      # 🔴 RESTORE AND SAVE ARE SEPARATE STEPS BECAUSE THE SAVE MUST HAPPEN ON A FAILING JOB.
      # `actions/cache` writes its cache in an implicit post-job step that only runs when the job
      # succeeded, so a suite that fails for any reason — including running out of time *because*
      # nothing was cached — can never populate the cache it needed. That is not hypothetical: it is
      # why every run so far has reported `Cache not found`, re-downloaded ~850 MB, and spent about
      # a quarter of the macOS job doing it. The explicit save step below carries `if: always()`.
      #
      # ⭐ THE KEY IS DELIBERATELY STATIC, and versioned by hand. Content-hashing the files that
      # trigger downloads was the previous approach and had two faults: it named
      # `test/test_ReadData.jl` and `test/test_AbioticEnv.jl`, both of which were renamed out of
      # existence (`hashFiles` contributes nothing for a path that does not exist, so the key silently
      # stopped tracking anything), and nineteen test files can now trigger a download, so any edit to
      # any of them would mint a fresh ~1.3 GB cache entry per matrix job and evict the far more
      # valuable depot caches under the repository's 10 GB ceiling.
      #
      # ⚠️ A restored cache can never be wrong, only incomplete: `getraster`/`download` each test the
      # target file's own existence before fetching, so a partial restore costs a few per-file
      # downloads rather than giving incorrect data. That is what makes a static key safe — and it is
      # also the repair route if a save ever lands incomplete. BUMP THE `-v1` SUFFIX to mint a new
      # entry; there is no need to work out which file changed.
      uses: actions/cache/restore@v6
      with:
        path: ~/.julia/scratchspaces
        key: rasterdata-${{ runner.os }}-v1
        restore-keys: |
          rasterdata-${{ runner.os }}-
    - name: Build package
      uses: julia-actions/julia-buildpkg@v1
    - name: Running
      # ⭐ Coverage instrumentation is a large slowdown and only one job's output is ever used, so it
      # runs on exactly one matrix entry — macOS, which is the fastest runner here, on the release
      # Julia. Every other entry runs the same tests uninstrumented.
      uses: julia-actions/julia-runtest@v1
      with:
        coverage: ${{ matrix.os == 'macOS-latest' && matrix.julia-version == '1' }}
    - name: Discard the extracted archives before the cache is saved
      # ⭐ Worth 182 MB of the ~1 GB raster cache, at no cost. These are the *downloaded archives*,
      # and RasterDataSources extracts each one and thereafter tests `!isfile(raster_path)` on the
      # **extracted** tif before fetching anything (`WorldClim/climate.jl:21`) — so the archive is
      # only ever consulted when its tif is missing, and caching the tifs without it triggers no
      # re-download.
      #
      # ⚠️ Done as a step rather than as a `!`-exclusion in the cache `path`, because
      # `actions/cache` saves in a post-job step: deleting here is unambiguous, whereas whether a
      # leading `~` expands inside an exclusion pattern is not.
      if: always()
      shell: bash
      run: rm -rf ~/.julia/scratchspaces/*/assets/RasterDataSources/*/*/zips
    - name: Save the raster data cache
      # ⭐ `if: always()` is the whole point of splitting restore from save — see the restore step.
      # Skipped on an exact hit, since `actions/cache/save` cannot overwrite a key that already
      # exists and would only log a warning. `cache-hit` is `true` only for an *exact* match, so a
      # run that fell back to the `restore-keys` prefix does still save, which is how a cache minted
      # under an older key version gets promoted to the current one.
      #
      # ⚠️ Ordered after the archive discard above, so the 182 MB of zips are gone before the save
      # reads the directory. With the implicit post-job save this ordering was invisible and only
      # worked by accident of post steps running last.
      if: always() && steps.rasters.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.julia/scratchspaces
        key: rasterdata-${{ runner.os }}-v1
    - name: Process coverage
      if: matrix.os == 'macOS-latest' && matrix.julia-version == '1'
      uses: julia-actions/julia-processcoverage@v1
    - name: Codecov
      if: matrix.os == 'macOS-latest' && matrix.julia-version == '1'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
