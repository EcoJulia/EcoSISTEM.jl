name: CI

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:

permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
  actions: write
  contents: read

jobs:
  # Fetch the rasters the suite reads, in a job that does nothing else, so the job that runs the
  # tests can restore them instead of downloading them.
  #
  # THIS IS ABOUT MEMORY AS MUCH AS TIME. Downloading while the suite is at its peak is what made
  # the Linux runner unsurvivable: `test_datasetread.jl` alone reached 7.0 GB resident of the
  # runner's 16 GB, and ~1 GB of concurrent downloads filling the page cache on top of that took the
  # machine far enough into swap that the Actions agent was sent a shutdown signal. **Nothing after
  # that point runs** - not `if: always()`, not a post step - so the tests never reached their own
  # cache-saving step and the next run downloaded again. The loop could not break itself, which is
  # why breaking it needs a job that is not the test job.
  #
  # `test/primecache.jl` calls `getraster`, which downloads without reading pixels, so this job
  # stays in a few hundred MB whatever it fetches - it survives precisely what the test job could not.
  prime-raster-cache:
    name: Prime the raster cache - ${{ matrix.os }}
    # Long enough for every entry to be retried twice a minute apart on a flaky host; the job is
    # skipped altogether once the cache exists, so the allowance costs nothing.
    timeout-minutes: 75
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write
      contents: read
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
      fail-fast: false
    steps:
    # Checked out before the probe, because the key hashes a source file - see the test job's
    # restore step for why that one file is in the key.
    - name: Checkout code
      uses: actions/checkout@v7
    # `lookup-only` asks whether the key exists WITHOUT downloading the ~1 GB behind it, and every
    # step below is skipped when it does. So once a cache exists this whole job is a metadata query
    # taking seconds, and only a cold cache pays for Julia, the build and the fetch.
    - name: Is the raster cache already there?
      id: probe
      uses: actions/cache/restore@v6
      with:
        path: ~/.julia/scratchspaces
        key: rasterdata-${{ runner.os }}-v4-${{ hashFiles('src/datasetread.jl') }}
        lookup-only: true
    # A miss is usually the aggregation code having changed, which stales the cached aggregates
    # but not the ~850 MB of downloads. An older entry supplies the downloads, so only the
    # aggregates are recomputed; a wholly cold runner gets nothing here and fetches everything.
    - name: Restore the downloads from an older entry
      if: steps.probe.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.julia/scratchspaces
        key: rasterdata-${{ runner.os }}-v4-${{ hashFiles('src/datasetread.jl') }}
        restore-keys: |
          rasterdata-${{ runner.os }}-
    - name: Set up julia
      if: steps.probe.outputs.cache-hit != 'true'
      uses: julia-actions/setup-julia@v3
      with:
        version: '1'
    - name: Cache
      if: steps.probe.outputs.cache-hit != 'true'
      uses: julia-actions/cache@v3
    - name: Build package
      if: steps.probe.outputs.cache-hit != 'true'
      uses: julia-actions/julia-buildpkg@v1
    - name: Download the rasters
      # Goes through `Pkg.test` for the same reason every other invocation does: `RasterDataSources`
      # is a weak dependency and only the test environment provides it.
      #
      # `primecache.jl` sets the `gaps` output when a source could not be reached, which decides the
      # key below: an entry with gaps must not claim the full key, or the next run probes it, skips
      # priming, and every raster job fetches the missing files itself. Saved under a run-specific
      # key instead, it still serves as a base through `restore-keys`, and the next run primes again.
      id: prime
      if: steps.probe.outputs.cache-hit != 'true'
      shell: bash
      run: julia --project -e 'using Pkg; Pkg.test(test_args = ["primecache.jl"])'
    - name: Discard the extracted archives before the cache is saved
      # The same 182 MB saving as in the test job below, and the same reasoning - see there.
      if: always() && steps.probe.outputs.cache-hit != 'true'
      shell: bash
      run: rm -rf ~/.julia/scratchspaces/*/assets/RasterDataSources/*/*/zips
    - name: Save the raster data cache
      # `if: always()` so a partly-primed cache is still saved. `primecache.jl` reports a failed
      # entry rather than throwing, exactly so that one unreachable host does not discard the rest:
      # a gap costs the test job a few downloads, never a wrong answer.
      if: always() && steps.probe.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.julia/scratchspaces
        key: ${{ steps.prime.outputs.gaps == 'true' && format('rasterdata-{0}-v4-partial-{1}', runner.os, github.run_id) || format('rasterdata-{0}-v4-{1}', runner.os, hashFiles('src/datasetread.jl')) }}

  EcoSISTEM-tests:
    name: ${{ matrix.suite }} - Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    needs: prime-raster-cache
    # Priming is an OPTIMISATION, NEVER A GATE. A plain `needs:` would skip the whole test matrix
    # when a prime job failed, which would turn a slow download into no tests at all; `!cancelled()`
    # keeps the dependency's *ordering* - the tests start once priming is done - while dropping its
    # veto. The tests still fetch anything the cache lacks, exactly as before this job existed.
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      matrix:
        # ONE JOB PER TEST SET, so each has the whole timeout to itself. Run in sequence in one job,
        # the sets took over an hour on the macOS and Ubuntu runners. `core_rasters` is the five
        # unit test files that read real rasters, which run one at a time on a runner to keep within
        # memory; `extras` is every extra set, as a full local run runs them.
        suite:
          - core_test
          - core_rasters
          - core_ext
          - extras
        julia-version:
          - '1.11'
          - '1.12'
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        R-version:
          - 'release'
        arch:
          - x64
          - arm64
        experimental:
          - false
        exclude:
          # The extras check the package against things outside it, and run on the current release
          # (Ubuntu and macOS, where the coverage job is) and on the oldest supported version
          # (Ubuntu). `runtests.jl` skips them on a Windows runner anyway.
          - suite: extras
            os: windows-latest
          - suite: extras
            julia-version: '1.12'
          - suite: extras
            julia-version: '1.11'
            os: macOS-latest
          - os: macOS-latest
            arch: x64
          - os: ubuntu-latest
            arch: arm64
          - os: windows-latest
            arch: arm64
      fail-fast: false
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up julia
      uses: julia-actions/setup-julia@v3
      with:
        version: ${{ matrix.julia-version }}
        arch: ${{ matrix.arch }}
    - name: Cache
      # **The depot cache must NOT be keyed on the test set.** By default this action appends every
      # matrix value to its key, which after the split gave each of the thirty jobs its own ~1.2 GB
      # entry - about 36 GB competing for the repository's 10 GB cache limit, so entries are evicted,
      # jobs precompile from cold, and the raster caches can go the same way. One depot serves all
      # four sets on a given OS, Julia and architecture, which is what this key says.
      uses: julia-actions/cache@v3
      with:
        cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};julia=${{ matrix.julia-version }};arch=${{ matrix.arch }}
        include-matrix: false
    - name: Restore the raster data cache
      id: rasters
      # julia-actions/cache caches the package depot but not scratchspaces, where the raster
      # downloads (~850 MB) and aggregated layers (~700 MB) live. Cache them here - tar preserves
      # mtime, so the aggregate cache, which is keyed partly on source mtime, still hits.
      #
      # THIS JOB ONLY RESTORES; `prime-raster-cache` is what fills the cache. It used to save
      # here too, as a fallback - but that step could only ever fire when the prime job had failed
      # to write the key, since `actions/cache/save` is skipped on an exact hit and the two use the
      # identical key. Priming made it dead code, so it is gone, along with the archive-discard step
      # that existed only to run before it.
      #
      # The reason the prime job splits restore from save is still live and worth knowing: the
      # implicit post-job save of `actions/cache` runs only when the job SUCCEEDED, so a suite that
      # fails for any reason - including running out of time *because* nothing was cached - can
      # never populate the cache it needed. `prime-raster-cache`'s explicit save carries
      # `if: always()` for exactly that reason.
      #
      # THE KEY IS STATIC BUT FOR ONE FILE, and versioned by hand. Content-hashing the files that
      # trigger downloads was an earlier approach and had two faults: it named
      # `test/test_ReadData.jl` and `test/test_AbioticEnv.jl`, both of which were renamed out of
      # existence (`hashFiles` contributes nothing for a path that does not exist, so the key silently
      # stopped tracking anything), and nineteen test files can now trigger a download, so any edit to
      # any of them would mint a fresh ~1.3 GB cache entry per matrix job and evict the far more
      # valuable depot caches under the repository's 10 GB ceiling.
      #
      # The one file in the key is `src/datasetread.jl`, because the aggregate cache it fills is
      # keyed on a digest of that file's text: any edit there makes every cached aggregate stale, and a
      # test job then aggregates cold - 11.6 GB resident for the twelve land-cover bands, which is
      # what killed the Linux jobs two minutes into the suite. Keying on the same file makes the
      # prime job recompute the aggregates whenever they can no longer be served. That file changes
      # rarely, and it cannot be renamed away unnoticed: `test/primecache.jl` says so beside the
      # reads it primes.
      #
      # A restored cache can never be wrong, only incomplete: `getraster`/`download` each test the
      # target file's own existence before fetching, so a partial restore costs a few per-file
      # downloads rather than giving incorrect data. That is what makes the static part safe - and
      # it is also the repair route if a save ever lands incomplete. BUMP THE `-v4` SUFFIX to mint
      # a new entry; there is no need to work out which file changed.
      uses: actions/cache/restore@v6
      with:
        path: ~/.julia/scratchspaces
        key: rasterdata-${{ runner.os }}-v4-${{ hashFiles('src/datasetread.jl') }}
        restore-keys: |
          rasterdata-${{ runner.os }}-
    - name: Build package
      uses: julia-actions/julia-buildpkg@v1
    - name: Running
      # Coverage instrumentation is a large slowdown, so it runs on one Julia and OS - macOS, on the
      # release Julia - for every test set; Codecov merges the uploads. Every other entry runs the
      # same tests uninstrumented.
      #
      # `ECOSISTEM_TEST_JOBS` asks for two workers on macOS: the runner reports too little free memory
      # for ParallelTestRunner to choose a second, which runs every file in sequence. The raster
      # files still run one at a time. Elsewhere the runner's own choice stands.
      #
      # `prefix` CARRIES THE RESOURCE SAMPLER, and where it runs is the whole point. The Linux
      # runner is shut down about two minutes into the suite with nothing but `signal 15` and
      # *"the runner has received a shutdown signal"* to show for it. **When that happens the job
      # is ABORTED rather than failed, so no further step runs** - not an `if: always()` one, not a
      # post step. Measured: an earlier attempt sampled into a file under `RUNNER_TEMP` and printed
      # it from a later step; the sampler step ran, the reporting step never did, and nothing was
      # recovered.
      # As a `prefix` the sampler wraps the julia invocation, so its output is **this step's own
      # stdout** - which GitHub streams to the log as it is produced. Every reading is therefore
      # already in the log before the machine is gone. Grep the log for `RES`.
      # Not on Windows: `free` is GNU-only, and Windows now runs the suite to completion anyway.
      uses: julia-actions/julia-runtest@v1
      env:
        ECOSISTEM_TEST_JOBS: ${{ matrix.os == 'macOS-latest' && '2' || '' }}
      with:
        test_args: ${{ matrix.suite }}
        coverage: ${{ matrix.os == 'macOS-latest' && matrix.julia-version == '1' }}
        prefix: ${{ runner.os != 'Windows' && format('{0}/.github/sample-resources.sh', github.workspace) || '' }}
    - name: Process coverage
      if: matrix.os == 'macOS-latest' && matrix.julia-version == '1'
      uses: julia-actions/julia-processcoverage@v1
    - name: Codecov
      if: matrix.os == 'macOS-latest' && matrix.julia-version == '1'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
        # **One flag per test set, because coverage is now four partial uploads rather than one
        # whole one.** Unlabelled, they are indistinguishable, so a late or missing upload reads as
        # "those lines are uncovered" and the project status falls by whatever that set covers -
        # measured on the first split run at 11.5 points, which is the raster set's share. With a
        # flag each, `.codecov.yml` carries a missing one forward from the last commit that had it
        # instead, and the report says which set covered what.
        flags: ${{ matrix.suite }}
